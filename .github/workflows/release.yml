name: Release

# Bump the version in module.prop and push to main: if there is no release for
# that version yet, this builds the zip, creates the tag and publishes the release.
# Pushing a tag like v6.8 by hand also works (it must match module.prop).
on:
  push:
    branches: [main]
    paths: [module.prop]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep '^version=' module.prop | cut -d= -f2)
          echo "VER=$v" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "module.prop version $v != tag $GITHUB_REF_NAME"; exit 1
          fi
          if gh release view "$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $v already exists, only building the artifact"
            echo "PUBLISH=0" >> "$GITHUB_ENV"
          else
            echo "PUBLISH=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build isubcodes.dex from IsubCodes.java
        run: |
          D8=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)d8
          mkdir -p build
          javac --release 8 -d build IsubCodes.java
          "$D8" --min-api 30 --output build build/IsubCodes.class
          mv build/classes.dex isubcodes.dex
          sha256sum isubcodes.dex

      - name: Syntax-check the scripts
        run: for f in *.sh META-INF/com/google/android/update-binary; do sh -n "$f"; done

      - name: Package the module
        run: |
          v=$(grep '^version=' module.prop | cut -d= -f2)
          zip -r "wifisimoff-$v.zip" META-INF module.prop *.sh README.md LICENSE IsubCodes.java isubcodes.dex banner.png webroot
          unzip -l "wifisimoff-$v.zip"
          echo "ZIP=wifisimoff-$v.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}

      - name: Publish the release
        if: env.PUBLISH == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v t="## $VER" '$0==t{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release create "$VER" "$ZIP" --target "$GITHUB_SHA" --title "WiFi SIM Switch $VER" --notes-file notes.md
